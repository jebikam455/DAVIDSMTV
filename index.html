<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM TV GBI Pertama Cimone</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
    }
    .page-title {
      font-family: 'Righteous', cursive, sans-serif;
      font-size: 2.2rem;
      text-align: center;
      color: #ffffff;
      margin-bottom: 25px; 
      letter-spacing: 1.5px;
      width: 100%;
    }
    .video-container {
      width: 100%;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .player-wrapper {
      position: relative;
      padding-top: 56.25%;
      width: 100%;
      background: #000;
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* TOMBOL PLAY PELINDUNG */
    .play-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .play-btn {
      width: 70px;
      height: 70px;
      background: #ef4444;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
      transition: transform 0.2s;
    }
    .play-overlay:hover .play-btn {
      transform: scale(1.1);
    }
    .video-info { padding: 24px; }
    .video-info h1 { font-size: 1.25rem; margin-bottom: 12px; }
    .video-info p { font-size: 0.875rem; color: #94a3b8; line-height: 1.6; }
  </style>

  <script>
    window.open = function() { return null; };
    
    // Trik: Mengaktifkan iframe HANYA saat tombol Play merah diklik
    function startVideo() {
      const overlay = document.getElementById('overlay');
      const iframe = document.getElementById('video-player');
      
      // Load ulang URL video untuk memicu auto-play langsung tanpa sempat membuat pop-up
      iframe.src = "https://player.vidlove.cc/embed/movie/1167307?autoplay=1";
      overlay.style.display = 'none';
    }
  </script>
</head>
<body>

  <div class="main-container">
    <h1 class="page-title">SM TV GBI Pertama Cimone</h1>

    <div class="video-container">
      <div class="player-wrapper">
        <!-- Lapisan Tombol Play Kustom -->
        <div id="overlay" class="play-overlay" onclick="startVideo()">
          <div class="play-btn">▶</div>
        </div>

        <iframe 
          id="video-player"
          src="about:blank" 
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true">
        </iframe>
      </div>
      
      <div class="video-info">
        <h1>DAVID &#40;2025&#41;</h1>
        <p>Dari nyanyian ibunya hingga pertarungannya dengan Goliat. Perjalanan Daud dari gembala yang rendah hati menjadi raja menguji batas iman, keberanian, dan kasih sayang—berpuncak pada pertempuran untuk jiwa sebuah kerajaan.</p>
      </div>
    </div>
  </div>

</body>
</html>
